# Save as .github/workflows/update.yml in your repo
name: Update tenders
on:
  schedule:
    - cron: "0 5,11,16 * * 1-5"   # 3x per weekday (UTC)
  workflow_dispatch: {}            # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python scraper.py
      - name: Commit results
        run: |
          git config user.name "tender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update tenders $(date -u +%F)"
          git push
